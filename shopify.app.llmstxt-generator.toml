# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
# This file is rewritten by `shopify app config link` once linked to a Partner app.

name = "llms.txt generator"
client_id = "b296c9098b37dc2ea9edd4b514edce99"
application_url = "https://shopify-app-llms-txt-generator-and.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "/webhooks/shop/redact"

[access_scopes]
# PRD §12.1 — minimum scopes required to read store content and write URL redirects.
scopes = "read_products,read_content,write_content"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://shopify-app-llms-txt-generator-and.onrender.com/auth/callback",
  "https://shopify-app-llms-txt-generator-and.onrender.com/auth/shopify/callback",
  "https://shopify-app-llms-txt-generator-and.onrender.com/api/auth/callback"
]

[pos]
embedded = false

[app_proxy]
# PRD §12.2 — file served at https://<store>.myshopify.com/apps/llms,
# redirected from /llms.txt by a URL redirect created on install.
url = "https://shopify-app-llms-txt-generator-and.onrender.com/proxy/llms"
subpath = "llms"
prefix = "apps"
